<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPowerHost --- Хост картинок.</title>
    <style>
        /*А КТО ТУТ ПОРНУХУ ЗАЛИВАЕТ, ПИДОРАС? */
        body {
            font-family: 'Times New Roman', serif;
            background-color: #f0f0f0;
            color: #000;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        #container {
            width: 800px;
            margin: 0 auto;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
        }
        
        h1 {
            font-size: 24px;
            color: rgb(34, 255, 0);
            border-bottom: 2px solid #006;
            padding-bottom: 2px;
        }
        
        h2 {
            font-size: 18px;
            color: rgb(255, 115, 0);
            border-bottom: 1px dotted #006;
        }
        
        .upload-area {
            border: 2px dashed #999;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            background-color: #8e18ab;
        }
        
        .button {
            background-color: rgb(0, 0, 0);
            color: white;
            border: none;
            padding: 8px 15px;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            cursor: pointer;
        }
        
        .button:hover {
            background-color: #004;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .image-item {
            border: 1px solid #ccc;
            padding: 5px;
            background-color: #fff;
            text-align: center;
        }
        
        .image-item img {
            max-width: 100%;
            height: auto;
        }
        
        .image-info {
            font-size: 12px;
            margin-top: 5px;
        }
        
        hr {
            border: 0;
            height: 1px;
            background-color: #ccc;
            margin: 20px 0;
        }
        
        footer {
            font-size: 12px;
            text-align: center;
            color: #666;
            margin-top: 20px;
        }
        
        /* Простая навигация в стиле веб 1.0 */
        .nav {
            background-color: #006;
            padding: 10px;
            margin-bottom: 20px;
        }
        
        .nav a {
            color: rgb(100, 13, 222);
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }
        
        .nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="nav">
            <a href="#">Главная</a>
            <a href="#">Загрузить</a>
            <a href="#">Галерея</a>
            <a href="about.html">О сайте </a>
            <a href="update.html">Обновления</a>
            <div class="nav">
                
        </div>
        
        <h1>SkyPowerHost</h1>
        
        <div class="upload-area">
            <h2>Загрузите свою картинку</h2>
            <form action="#" method="post" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*"><br><br>
                <input type="submit" class="button" value="Загрузить">
            </form>
        </div>
        
        
        
        <footer>
            t.me/skypowershelter &copy; 2025 | Счетчик посещений: <span id="counter">?</span>
        </footer>
    </div>
</body>
</html>
